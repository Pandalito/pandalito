<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pandalito — Web Dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- HEADER -->
  <header>
    <a class="brand-mark" href="index.html">Pandalito ✳ dev</a>

    <!-- Nav normal: visible solo en desktop -->
    <nav class="nav-bar">
      <ul class="nav-list">
        <li class="nav-item"><a class="nav-link" href="">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="">My person</a></li>
        <li class="nav-item"><a class="nav-link" href="">I'm learning</a></li>
      </ul>
    </nav>

    <!-- Menú hamburguesa: visible solo en mobile, mismo patrón <details> que "Style" -->
    <details class="mobile-nav">
      <summary class="hamburger-btn" aria-label="Abrir menú">☰</summary>
      <ul class="nav-list nav-list--mobile">
        <li class="nav-item"><a class="nav-link" href="">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="">My person</a></li>
        <li class="nav-item"><a class="nav-link" href="">I'm learning</a></li>
      </ul>
    </details>

    <button class="btn-styles">styles</button>
  </header>

  <!-- MAIN -->
  <main class="hero">
    <h1 class="wordmark">PANDALITO</h1>

    <div class="character-wrap">
      <svg viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg">
        <!-- ideas -->
        <circle class="spark" cx="70" cy="5" r="4" />
        <circle class="spark" cx="110" cy="5" r="5" />
        <circle class="spark" cx="170" cy="5" r="6" />
        <circle class="spark" cx="230" cy="5" r="6" />
        <circle class="spark" cx="280" cy="5" r="5" />
        <circle class="spark" cx="320" cy="5" r="4" />

        <!-- tapa de la cabeza -->
        <ellipse class="lid" cx="200" cy="110" rx="102" ry="15" />

        <!-- lado izquierdo: cabeza -> cuello -> hombro, una sola línea abierta -->
        <path class="outline" d="
          M100,110
          C88,150 86,195 100,228
          C110,252 126,266 140,285
          C152,302 160,314 156,330
          C150,346 122,358 104,380
          C80,408 62,445 56,490
          L56,520
        " />

        <!-- lado derecho: espejo exacto del izquierdo -->
        <path class="outline" d="
          M300,110
          C312,150 314,195 300,228
          C290,252 274,266 260,285
          C248,302 240,314 244,330
          C250,346 278,358 296,380
          C320,408 338,445 344,490
          L344,520
        " />

        <!-- ojos -->
        <ellipse class="eye" cx="155" cy="195" rx="32" ry="45" />
        <ellipse class="eye" cx="245" cy="195" rx="32" ry="45" />
      </svg>

      <div class="role-labels">
        <span>Web</span>
        <span>dev</span>
      </div>
    </div>

    <nav class="pages">
      <a href="about.html">About</a>
      <a href="#learning">What I'm Learning</a>
    </nav>
  </main>

  <!-- FOOTER -->
  <footer>
    <span class="credit">© 2026 — pensamientos, ideas y código</span>
    <span class="footer-status"><span class="dot"></span>disponible para proyectos</span>
  </footer>

  <!-- SCRIPT -->
  <script src="script.js"></script>
</body>

</html>
